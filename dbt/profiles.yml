# No secrets here: AWS credentials come from the environment chain, and the
# bucket/database/workgroup resolve via env vars (host: `make dbt-build` sources
# .env first; scheduler container: env_file provides them).
tickstream:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: "{{ env_var('TICKSTREAM_AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      schema: "{{ env_var('TICKSTREAM_GLUE_DATABASE', 'tickstream') }}"
      s3_staging_dir: "s3://{{ env_var('TICKSTREAM_S3_BUCKET') }}/athena-results/"
      s3_data_dir: "s3://{{ env_var('TICKSTREAM_S3_BUCKET') }}/dbt/"
      work_group: "{{ env_var('TICKSTREAM_ATHENA_WORKGROUP', 'tickstream-pipeline') }}"
