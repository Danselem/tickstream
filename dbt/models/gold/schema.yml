version: 2

models:
  - name: gold_candles_1m
    description: "1-minute OHLC candles with volume, VWAP, trade count and volatility (stddev of per-trade log returns). Incremental MERGE on (symbol, candle_start) with a 30-minute trailing recompute window."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - candle_start
      - dbt_utils.expression_is_true:
          expression: "high >= low"
    columns:
      - name: symbol
        description: "Trading pair."
        tests:
          - not_null
      - name: candle_start
        description: "Minute bucket start, UTC."
        tests:
          - not_null
      - name: open
        description: "First trade price of the minute."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: high
        description: "Highest trade price of the minute."
        tests:
          - not_null
      - name: low
        description: "Lowest trade price of the minute."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: close
        description: "Last trade price of the minute."
        tests:
          - not_null
      - name: volume
        description: "Summed base-asset quantity."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: notional
        description: "Summed USD notional traded (sum(price*quantity))."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: vwap
        description: "Volume-weighted average price (sum(price*qty)/sum(qty))."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: trade_count
        description: "Number of trades in the minute."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      - name: volatility
        description: "Sample stddev of per-trade log returns within the minute. NULL for single-trade candles."

  - name: gold_market_summary_daily
    description: "Business summary per symbol per UTC day: open/close, high/low range, USD notional, volume, trade count, trades/min and % change. Incremental MERGE on (symbol, window_start) with a 2-day trailing recompute."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - window_start
      - dbt_utils.expression_is_true:
          expression: "high >= low"
    columns:
      - name: symbol
        description: "Trading pair."
        tests:
          - not_null
      - name: window_start
        description: "Day bucket start, UTC."
        tests:
          - not_null
      - name: open
        description: "First trade price of the day."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: close
        description: "Last trade price of the day."
        tests:
          - not_null
      - name: high
        description: "Highest trade price of the day."
        tests:
          - not_null
      - name: low
        description: "Lowest trade price of the day."
        tests:
          - not_null
      - name: notional
        description: "USD notional traded over the day."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: volume
        description: "Base-asset quantity traded over the day."
        tests:
          - not_null
      - name: trade_count
        description: "Number of trades over the day."
        tests:
          - not_null
      - name: trades_per_min
        description: "Average trades per minute (sum of trade_count over minutes present)."
        tests:
          - not_null
      - name: change_pct
        description: "Day % change: (close - open) / open."

  - name: gold_market_summary_hourly
    description: "Business summary per symbol per UTC hour. Same measures as the daily summary at hour grain; incremental MERGE with a 2-hour trailing recompute."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - window_start
      - dbt_utils.expression_is_true:
          expression: "high >= low"
    columns:
      - name: symbol
        description: "Trading pair."
        tests:
          - not_null
      - name: window_start
        description: "Hour bucket start, UTC."
        tests:
          - not_null
      - name: open
        description: "First trade price of the hour."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: close
        description: "Last trade price of the hour."
        tests:
          - not_null
      - name: high
        description: "Highest trade price of the hour."
        tests:
          - not_null
      - name: low
        description: "Lowest trade price of the hour."
        tests:
          - not_null
      - name: notional
        description: "USD notional traded over the hour."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: volume
        description: "Base-asset quantity traded over the hour."
        tests:
          - not_null
      - name: trade_count
        description: "Number of trades over the hour."
        tests:
          - not_null
      - name: trades_per_min
        description: "Average trades per minute (sum of trade_count over minutes present)."
        tests:
          - not_null
      - name: change_pct
        description: "Hour % change: (close - open) / open."

  - name: dim_symbol
    description: "Symbol dimension: one row per trading pair seen in silver, with base/quote assets and first/last seen timestamps. A view (ADR-019)."
    columns:
      - name: symbol
        description: "Trading pair."
        tests:
          - not_null
          - unique
      - name: base_asset
        description: "Base asset, e.g. XRP in XRPUSDT."
      - name: quote_asset
        description: "Quote asset, e.g. USDT in XRPUSDT."
      - name: first_seen
        description: "Earliest event time observed, UTC."
      - name: last_seen
        description: "Latest event time observed, UTC."

  - name: dim_time
    description: "Time dimension: bounded minute spine over the candles' time range, with hour/day/weekday attributes for heatmaps. A view (ADR-019)."
    columns:
      - name: minute_start
        description: "Minute bucket start, UTC."
        tests:
          - not_null
          - unique
      - name: hour_start
        description: "Containing hour start, UTC."
      - name: day_start
        description: "Containing day start, UTC."
      - name: weekday
        description: "Day of week (Mon..Sun)."
      - name: hour_of_day
        description: "Hour of day 0-23."
