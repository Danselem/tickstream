version: 2

models:
  - name: stg_trades
    description: "Typed view over bronze_trades. No dedup, no logic — silver owns that."
    columns:
      - name: symbol
        description: "Trading pair."
        tests:
          - not_null
      - name: trade_id
        description: "Binance trade id (unique per symbol)."
        tests:
          - not_null
      - name: price
        description: "Execution price."
      - name: quantity
        description: "Base-asset quantity."
      - name: event_time
        description: "Exchange match time, UTC."
        tests:
          - not_null
      - name: ingest_time
        description: "Producer arrival time, UTC."
      - name: is_buyer_maker
        description: "True when the buyer was the maker."

  - name: stg_klines
    description: "Typed view over bronze_klines (archive 1m candles). No dedup."
    columns:
      - name: symbol
        description: "Trading pair."
        tests:
          - not_null
      - name: open_time
        description: "Candle open time, UTC."
        tests:
          - not_null
      - name: close
        description: "Close price."
        tests:
          - not_null

  - name: stg_tickers
    description: "Typed view over bronze_tickers (1 Hz top-of-book snapshots). No dedup."
    columns:
      - name: symbol
        description: "Trading pair."
        tests:
          - not_null
      - name: event_time
        description: "Exchange event time, UTC."
        tests:
          - not_null
      - name: bid_price
        description: "Best bid price."
        tests:
          - not_null
      - name: ask_price
        description: "Best ask price."
        tests:
          - not_null
      - name: ingest_time
        description: "Producer arrival time, UTC."
        tests:
          - not_null
