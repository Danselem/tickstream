version: 2

sources:
  - name: lake
    description: "Raw Iceberg tables written by the Kafka consumer (PyIceberg/Glue)."
    database: awsdatacatalog
    schema: tickstream
    tables:
      - name: bronze_trades
        description: "Raw trade facts, upserted on (symbol, trade_id). Never modified."
        loaded_at_field: ingest_time
        freshness:
          warn_after: { count: 10, period: minute }
          error_after: { count: 30, period: minute }
        columns:
          - name: symbol
            description: "Trading pair, e.g. XRPUSDT. The Kafka message key."
          - name: trade_id
            description: "Binance trade id (unique per symbol)."
          - name: price
            description: "Execution price (decimal)."
          - name: quantity
            description: "Base-asset quantity (decimal)."
          - name: event_time
            description: "Exchange match time, UTC (Binance `T`)."
          - name: ingest_time
            description: "Producer arrival time, UTC."
          - name: is_buyer_maker
            description: "True when the buyer was the maker (Binance `m`)."
      - name: bronze_klines
        description: "Archive 1m klines (Aug 2026+ backfill), one row per symbol + open_time. Never modified."
        columns:
          - name: symbol
            description: "Trading pair."
          - name: open_time
            description: "Candle open time, UTC (archive microseconds normalised)."
          - name: open
            description: "Open price."
          - name: high
            description: "High price."
          - name: low
            description: "Low price."
          - name: close
            description: "Close price."
          - name: volume
            description: "Base-asset volume."
          - name: quote_volume
            description: "Quote-asset (USDT) volume."
          - name: trade_count
            description: "Trades in the minute."
          - name: taker_buy_base_volume
            description: "Taker-buy base volume."
          - name: taker_buy_quote_volume
            description: "Taker-buy quote volume."
          - name: ingest_time
            description: "Backfill write time, UTC."
          - name: source
            description: "Archive source label (archive)."
      - name: bronze_tickers
        description: "Raw 1 Hz top-of-book snapshots, upserted on (symbol, event_time). Never modified."
        loaded_at_field: ingest_time
        freshness:
          warn_after: { count: 5, period: minute }
          error_after: { count: 30, period: minute }
        columns:
          - name: symbol
            description: "Trading pair."
          - name: event_time
            description: "Exchange event time, UTC (Binance `E`)."
          - name: ingest_time
            description: "Producer arrival time, UTC."
          - name: last_price
            description: "Last trade price (Binance `c`)."
          - name: last_quantity
            description: "Last trade quantity (Binance `Q`)."
          - name: bid_price
            description: "Best bid price (Binance `b`)."
          - name: bid_quantity
            description: "Best bid quantity (Binance `B`)."
          - name: ask_price
            description: "Best ask price (Binance `a`)."
          - name: ask_quantity
            description: "Best ask quantity (Binance `A`)."
          - name: open_24h
            description: "Rolling 24 h open (Binance `o`)."
          - name: high_24h
            description: "Rolling 24 h high (Binance `h`)."
          - name: low_24h
            description: "Rolling 24 h low (Binance `l`)."
          - name: volume_24h
            description: "Rolling 24 h base volume (Binance `v`)."
          - name: quote_volume_24h
            description: "Rolling 24 h quote volume (Binance `q`)."
          - name: trade_count_24h
            description: "Rolling 24 h trade count (Binance `n`)."
