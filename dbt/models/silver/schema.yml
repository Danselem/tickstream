version: 2

models:
  - name: silver_trades
    description: "Deduped trades (one row per symbol + trade_id). Incremental MERGE with a 2-hour late-arrival lookback."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - trade_id
    columns:
      - name: symbol
        description: "Trading pair (USDT-quoted; set via TICKSTREAM_SYMBOLS)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "LIKE '%USDT'"
      - name: trade_id
        description: "Binance trade id (unique per symbol)."
        tests:
          - not_null
      - name: price
        description: "Execution price, must be positive."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: quantity
        description: "Base-asset quantity, must be positive."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: event_time
        description: "Exchange match time, UTC."
        tests:
          - not_null
      - name: ingest_time
        description: "Producer arrival time, UTC."
        tests:
          - not_null
      - name: is_buyer_maker
        description: "True when the buyer was the maker."
        tests:
          - not_null

  - name: silver_klines
    description: "Deduped archive 1m klines (one row per symbol + open_time). A view: the archive is static."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - open_time
    columns:
      - name: symbol
        description: "Trading pair."
        tests:
          - not_null
      - name: open_time
        description: "Candle open time, UTC."
        tests:
          - not_null
      - name: high
        description: "High price, >= low."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= low"
      - name: low
        description: "Low price, > 0."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: volume
        description: "Base volume, non-negative."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: trade_count
        description: "Trades in the minute."
        tests:
          - not_null

  - name: silver_tickers
    description: "Deduped ticker snapshots (one row per symbol + event_time). Incremental MERGE with a 2-hour lookback."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - event_time
    columns:
      - name: symbol
        description: "Trading pair (USDT-quoted)."
        tests:
          - not_null
      - name: event_time
        description: "Exchange event time, UTC."
        tests:
          - not_null
      - name: bid_price
        description: "Best bid price, must be positive."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: ask_price
        description: "Best ask price, must be positive."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: last_price
        description: "Last trade price."
        tests:
          - not_null
      - name: trade_count_24h
        description: "Rolling 24 h trade count."
        tests:
          - not_null
      - name: ingest_time
        description: "Producer arrival time, UTC."
        tests:
          - not_null
