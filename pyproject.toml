[project]
name = "tickstream"
version = "0.1.0"
description = "Real-time crypto streaming pipeline: Binance WebSocket → Kafka → Apache Iceberg on S3 → dbt on Athena"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Daniel Egbo" }]
dependencies = [
  "confluent-kafka>=2.11",
  "dbt-athena-community>=1.10",
  "dbt-core>=1.10",
  "great-expectations>=1.20",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyathena<=3.35",
  "pydantic>=2.10",
  "pydantic-settings>=2.5",
  "pyiceberg[glue,s3fs,pandas]>=0.9",
  "structlog>=25.1",
  "websockets>=15",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
exclude = [".agents", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Kafka/AWS (skipped by default; run with -m integration)",
]
